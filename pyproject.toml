[project]
name = "mattfeng-utils"
version = "0.3.0"
description = "Small uvx-installable utility CLIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
install-jj = "uvx_utils.install_jj:main"
install-just = "uvx_utils.install_just:main"
install-zsh-plugin = "uvx_utils.install_zsh_plugin:main"
setup-gitignore = "uvx_utils.setup_gitignore:main"
setup-compose = "uvx_utils.setup_compose:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvx_utils"]

[tool.hatch.build.targets.wheel.force-include]
"zsh-plugins" = "uvx_utils/zsh_plugins"

[tool.hatch.build.targets.sdist]
include = [
  "src/uvx_utils",
  "zsh-plugins",
  "README.md",
  "pyproject.toml",
]
