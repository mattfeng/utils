[project]
name = "mattfeng-utils"
version = "0.1.0"
description = "Small uvx-installable utility CLIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
install-just = "uvx_utils.install_just:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvx_utils"]
