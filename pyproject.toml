[project]
name = "mattfeng-utils"
version = "0.2.0"
description = "Small uvx-installable utility CLIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
install-jj = "uvx_utils.install_jj:main"
install-just = "uvx_utils.install_just:main"
setup-gitignore = "uvx_utils.setup_gitignore:main"
setup-compose = "uvx_utils.setup_compose:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvx_utils"]
